<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mathe 5 – Übungen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@700;800;900&display=swap">
<style>
  /* Stil wie die Canva-Folien „Mathe5_…“: hellblauer Grund mit feinem Raster, Titel in der Pillen-Form
     (Dunkelblau umrandet, weiße Strichellinie, versetzter Schatten), Versalien, Bleistift/Taschenrechner/Rechenzeichen */
  :root{--navy:#003357;--bg:#daf1ff;--pill:#c4e4fb;--blue:#27abfc;--acc:#ef6c00;--muted:#3d6584;
    --display:"Fredoka","Baloo 2","Arial Rounded MT Bold",system-ui,sans-serif;--body:"Nunito","Arial Rounded MT Bold","Segoe UI",system-ui,sans-serif}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;color:var(--navy);font-family:var(--body);font-weight:800;background:var(--bg);overflow-x:hidden;
    background-image:linear-gradient(rgba(255,255,255,.75) 1.5px,transparent 1.5px),linear-gradient(90deg,rgba(255,255,255,.75) 1.5px,transparent 1.5px);background-size:44px 44px}
  .wrap{max-width:1060px;margin:0 auto;padding:22px max(16px,env(safe-area-inset-right,0px)) 48px max(16px,env(safe-area-inset-left,0px))}

  /* ---------- Kopf wie die Titelfolie ---------- */
  .hero{position:relative;height:300px;margin-bottom:10px}
  .hero svg.d{position:absolute;display:block}
  .pill{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(560px,86%);text-align:center}
  .pill .shape{position:relative;background:var(--pill);border:5px solid var(--navy);border-radius:999px;padding:30px 26px 26px;
    box-shadow:0 12px 0 var(--navy)}
  .pill .shape::before{content:"";position:absolute;inset:9px;border:3px dashed #fff;border-radius:999px;pointer-events:none}
  .pill h1{position:relative;margin:0;font-family:var(--display);font-weight:700;font-size:clamp(2.2rem,7vw,3.6rem);line-height:1;letter-spacing:.04em;text-transform:uppercase}
  .pill p{position:relative;margin:8px 0 0;font-size:clamp(1rem,2.6vw,1.2rem);color:var(--muted)}
  .dash{position:absolute;height:6px;border-radius:3px;background:var(--navy)}
  .legend{text-align:center;color:var(--muted);font-size:1rem;margin:18px 0 6px}

  /* ---------- Kapitel ---------- */
  h2{font-family:var(--display);font-weight:700;font-size:clamp(1.6rem,4vw,2.1rem);letter-spacing:.05em;text-transform:uppercase;margin:30px 0 16px;
    display:flex;align-items:center;gap:14px}
  h2 .k{display:inline-grid;place-items:center;width:50px;height:50px;border-radius:50%;background:var(--navy);color:#fff;font-size:1.5rem;letter-spacing:0}
  h2::after{content:"";flex:1;height:5px;border-radius:3px;background:repeating-linear-gradient(90deg,var(--navy) 0 26px,transparent 26px 40px)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(245px,1fr));gap:20px 18px}

  /* ---------- Karten im Pillen-Stil ---------- */
  a.card{position:relative;display:flex;align-items:center;gap:14px;text-decoration:none;color:inherit;background:var(--pill);
    border:4px solid var(--navy);border-radius:28px;padding:14px 16px;box-shadow:0 8px 0 var(--navy);transition:transform .12s,box-shadow .12s}
  a.card::before{content:"";position:absolute;inset:6px;border:2.5px dashed #fff;border-radius:21px;pointer-events:none}
  a.card:hover,a.card:focus-visible{transform:translateY(-4px);box-shadow:0 12px 0 var(--navy);outline:none}
  a.card:active{transform:translateY(4px);box-shadow:0 4px 0 var(--navy)}
  .num{position:relative;flex:0 0 auto;width:60px;height:60px;border-radius:50%;display:grid;place-items:center;background:#fff;border:3px solid var(--navy);
    font-family:var(--display);font-weight:700;font-size:28px;line-height:1;color:var(--navy);white-space:nowrap}
  .num.small{font-size:17px;letter-spacing:-.02em}
  .txt{position:relative;min-width:0}
  .nr{font-family:var(--display);font-size:.95rem;font-weight:700;color:var(--acc);letter-spacing:.04em}
  .title{font-family:var(--display);font-size:1.18rem;font-weight:600;line-height:1.15;hyphens:auto;-webkit-hyphens:auto;overflow-wrap:break-word}
  .go{font-size:.85rem;color:var(--muted);margin-top:3px}
  a.card.soon{pointer-events:none;opacity:.5;box-shadow:0 8px 0 rgba(0,51,87,.5)}

  @media (max-width:640px){.hero{height:190px}.hero svg.d,.hero .dash{display:none}}
  @media (prefers-reduced-motion:reduce){a.card{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <!-- Bleistift und Radiergummi -->
    <svg class="d side" style="left:0;top:4px;width:150px" viewBox="0 0 150 130" aria-hidden="true">
      <g transform="rotate(-35 60 60)">
        <rect x="14" y="40" width="70" height="34" rx="6" fill="#ffd23f" stroke="#003357" stroke-width="4"/>
        <rect x="14" y="40" width="22" height="34" rx="6" fill="#f4f4f4" stroke="#003357" stroke-width="4"/>
      </g>
      <g transform="rotate(50 105 70)">
        <rect x="62" y="58" width="80" height="22" rx="3" fill="#27abfc" stroke="#003357" stroke-width="4"/>
        <rect x="56" y="58" width="12" height="22" rx="3" fill="#ff8a80" stroke="#003357" stroke-width="4"/>
        <path d="M142 58 L164 69 L142 80 Z" fill="#ffe0b2" stroke="#003357" stroke-width="4" stroke-linejoin="round"/>
        <path d="M157 65.5 L164 69 L157 72.5 Z" fill="#003357"/>
      </g>
    </svg>
    <!-- gepunkteter Bogen oben -->
    <svg class="d" style="left:36%;top:-4px;width:90px" viewBox="0 0 110 60" aria-hidden="true">
      <path d="M8 4 A47 47 0 0 0 102 4" fill="none" stroke="#003357" stroke-width="7" stroke-linecap="round" stroke-dasharray="0.1 13"/>
    </svg>
    <!-- Sternchen -->
    <svg class="d" style="left:26%;top:40px;width:34px" viewBox="0 0 34 34" aria-hidden="true">
      <g stroke="#27abfc" stroke-width="5" stroke-linecap="round"><line x1="17" y1="3" x2="17" y2="31"/><line x1="3" y1="17" x2="31" y2="17"/><line x1="7" y1="7" x2="27" y2="27"/><line x1="27" y1="7" x2="7" y2="27"/></g>
    </svg>
    <svg class="d" style="left:62%;bottom:24px;width:30px" viewBox="0 0 34 34" aria-hidden="true">
      <g stroke="#27abfc" stroke-width="5" stroke-linecap="round"><line x1="17" y1="3" x2="17" y2="31"/><line x1="3" y1="17" x2="31" y2="17"/><line x1="7" y1="7" x2="27" y2="27"/><line x1="27" y1="7" x2="7" y2="27"/></g>
    </svg>
    <!-- Taschenrechner -->
    <svg class="d side" style="right:0;top:8px;width:120px" viewBox="0 0 120 140" aria-hidden="true">
      <g transform="rotate(-18 60 70)">
        <rect x="18" y="10" width="84" height="118" rx="12" fill="#27abfc" stroke="#003357" stroke-width="4"/>
        <rect x="30" y="22" width="60" height="24" rx="4" fill="#e6f7ff" stroke="#003357" stroke-width="3"/>
        <g fill="#fff" stroke="#003357" stroke-width="2.5">
          <rect x="30" y="56" width="14" height="13" rx="3"/><rect x="53" y="56" width="14" height="13" rx="3"/><rect x="76" y="56" width="14" height="13" rx="3" fill="#ff8a80"/>
          <rect x="30" y="76" width="14" height="13" rx="3"/><rect x="53" y="76" width="14" height="13" rx="3"/><rect x="76" y="76" width="14" height="13" rx="3"/>
          <rect x="30" y="96" width="14" height="13" rx="3"/><rect x="53" y="96" width="14" height="13" rx="3"/><rect x="76" y="96" width="14" height="13" rx="3"/>
        </g>
      </g>
    </svg>
    <!-- Rechenzeichen-Plättchen -->
    <svg class="d side" style="right:6%;bottom:0;width:120px" viewBox="0 0 120 110" aria-hidden="true">
      <g transform="rotate(14 60 55)" stroke="#003357" stroke-width="3.5">
        <rect x="6" y="6" width="48" height="44" rx="8" fill="#fff6e8"/><rect x="62" y="6" width="48" height="44" rx="8" fill="#fff6e8"/>
        <rect x="6" y="58" width="48" height="44" rx="8" fill="#fff6e8"/><rect x="62" y="58" width="48" height="44" rx="8" fill="#fff6e8"/>
        <g stroke="#ef6c00" stroke-width="7" stroke-linecap="round"><line x1="30" y1="16" x2="30" y2="40"/><line x1="18" y1="28" x2="42" y2="28"/><line x1="74" y1="28" x2="98" y2="28"/></g>
        <g stroke="#27abfc" stroke-width="7" stroke-linecap="round"><line x1="20" y1="70" x2="40" y2="90"/><line x1="40" y1="70" x2="20" y2="90"/><line x1="74" y1="74" x2="98" y2="74"/><line x1="74" y1="86" x2="98" y2="86"/></g>
      </g>
    </svg>
    <!-- Geodreieck -->
    <svg class="d side" style="left:2%;bottom:6px;width:140px" viewBox="0 0 140 80" aria-hidden="true">
      <path d="M6 72 L134 72 L70 8 Z" fill="#e6f7ff" fill-opacity=".9" stroke="#003357" stroke-width="4" stroke-linejoin="round"/>
      <path d="M38 72 A32 32 0 0 1 102 72" fill="none" stroke="#27abfc" stroke-width="3.5"/>
      <line x1="70" y1="72" x2="70" y2="18" stroke="#003357" stroke-width="2"/>
      <path d="M70 72 L112 34" stroke="#ef6c00" stroke-width="4" stroke-linecap="round"/>
    </svg>

    <div class="pill">
      <div class="shape"><h1>Mathe 5</h1><p>Wähle deine Übung und tippe sie an.</p></div>
    </div>
    <div class="dash" style="left:calc(50% + 150px);top:34px;width:50px"></div>
    <div class="dash" style="left:calc(50% + 70px);top:50px;width:130px;height:5px"></div>
    <div class="dash" style="left:calc(50% - 190px);bottom:30px;width:50px"></div>
    <div class="dash" style="left:calc(50% - 130px);bottom:30px;width:90px"></div>
  </div>
  <div class="legend">⭐ leicht · ⭐⭐ mittel · ⭐⭐⭐ Knobelei</div>

  <div id="liste"></div>
</div>

<script>
/* ============================================================
   HIER ANPASSEN:
   - Neues Kapitel: neuen Block in KAPITEL ergänzen
   - datei: Name der HTML-Datei (ohne .html)
   - fertig: true = Übung ist online, false = Karte wird grau
   ============================================================ */
const KAPITEL = [
  { nr: "2", name: "Geometrie", uebungen: [
    { nr: "2.1",  icon: "⌗",   datei: "2-1",  titel: "Koordinaten\u00ADsystem",      fertig: true },
    { nr: "2.2",  icon: "A–B", datei: "2-2",  titel: "Gerade und Strecke",     fertig: true },
    { nr: "2.3",  icon: "⊥",   datei: "2-3",  titel: "Senkrechte und Abstand", fertig: true },
    { nr: "2.4",  icon: "∥",   datei: "2-4",  titel: "Parallelen",             fertig: true },
    { nr: "2.5",  icon: "∠",   datei: "2-5",  titel: "Winkel und Winkelarten", fertig: true },
    { nr: "2.6",  icon: "📐",  datei: "2-6",  titel: "Winkel messen",          fertig: true },
    { nr: "2.7",  icon: "✏️",  datei: "2-7",  titel: "Winkel zeichnen",        fertig: true },
    { nr: "2.8",  icon: "▭",   datei: "2-8",  titel: "Rechteck und Quadrat",   fertig: true },
    { nr: "2.9",  icon: "📏",  datei: "2-9",  titel: "Längen schätzen",        fertig: true },
    { nr: "2.10", icon: "cm",  datei: "2-10", titel: "Längen umrechnen",       fertig: true },
    { nr: "2.11", icon: "u",   datei: "2-11", titel: "Umfang",                 fertig: true },
  ]},
];

const liste = document.getElementById("liste");
for (const k of KAPITEL) {
  const h = document.createElement("h2");
  h.innerHTML = `<span class="k">${k.nr}</span>${k.name}`;
  liste.appendChild(h);
  const g = document.createElement("div"); g.className = "grid";
  for (const u of k.uebungen) {
    const a = document.createElement("a");
    a.className = "card" + (u.fertig ? "" : " soon");
    a.href = u.datei + ".html";
    const small = [...u.icon].length > 2 ? " small" : "";
    a.innerHTML =
      `<div class="num${small}" aria-hidden="true">${u.icon}</div>
       <div class="txt"><div class="nr">${u.nr}</div><div class="title">${u.titel}</div>
       <div class="go">${u.fertig ? "Übung starten →" : "kommt bald"}</div></div>`;
    g.appendChild(a);
  }
  liste.appendChild(g);
}
</script>
</body>
</html>
