<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Profi 2.8 Rechteck und Quadrat</title>
<style>
:root{--navy:#003357;--bg:#daf1ff;--blue:#27abfc;--red:#ff3131;--green:#2e7d32;--card:#ffffff;--line:#b8d8ee}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--navy);font-family:"Arial Rounded MT Bold","Nunito","Segoe UI",system-ui,-apple-system,sans-serif;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:28px 28px;min-height:100vh}
header{max-width:860px;margin:0 auto;padding:18px 16px 6px;text-align:center;position:relative}
@media (max-width:560px){header{padding-top:52px}}
.back{position:absolute;left:16px;top:16px;font-size:15px;font-weight:700;color:var(--navy);text-decoration:none;background:#fff;border:2px solid var(--navy);border-radius:999px;padding:4px 12px}
.back:hover{background:var(--navy);color:#fff}
.badge{display:inline-block;background:var(--navy);color:#fff;border-radius:999px;padding:4px 14px;font-weight:700;font-size:15px;letter-spacing:.5px}
h1{margin:10px 0 4px;font-size:clamp(26px,5vw,40px)}
.sub{font-size:16px;opacity:.85}
#dots{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:12px 0 4px}
.dot{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#fff;border:3px solid var(--navy);font-weight:700}
.dot.cur{background:var(--blue);color:#fff}.dot.ok{background:var(--green);border-color:var(--green);color:#fff}.dot.no{background:var(--red);border-color:var(--red);color:#fff}
main{max-width:860px;margin:0 auto;padding:8px 16px 40px}
#card{background:var(--card);border:4px solid var(--navy);border-radius:28px;padding:22px clamp(16px,4vw,32px);box-shadow:0 6px 0 rgba(0,51,87,.15)}
.meta{display:flex;justify-content:space-between;font-weight:700;font-size:16px;opacity:.85;margin-bottom:8px}
.q{font-size:clamp(20px,3.2vw,26px);line-height:1.45;font-weight:700;margin:6px 0 14px}
.q small{font-weight:400}
.figwrap{display:flex;justify-content:center;margin:8px 0 14px}
.fig{width:100%;max-width:600px;height:auto;border-radius:14px}
.lbl{font:700 18px sans-serif;fill:var(--navy)}
.scale{font:700 13px sans-serif;fill:var(--navy)}.scale2{font:700 11px sans-serif;fill:#4a7da3}
.clk{font:700 20px sans-serif;fill:var(--navy)}
.fields{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;margin:10px 0}
.field{display:flex;align-items:center;gap:8px;font-size:22px;font-weight:700}
.field input{width:130px;font-size:26px;padding:10px 12px;border:3px solid var(--navy);border-radius:14px;text-align:center;color:var(--navy);font-weight:700}
.field input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 4px rgba(39,171,252,.25)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:10px 0}
.opt{font:inherit;font-size:21px;font-weight:700;color:var(--navy);background:#f3faff;border:3px solid var(--navy);border-radius:16px;padding:14px 10px;cursor:pointer;min-height:60px}
.opt.sel{background:var(--blue);color:#fff;border-color:var(--blue)}
.opt.used{opacity:.35}
.seq{min-height:54px;border:3px dashed var(--blue);border-radius:14px;padding:8px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}
.chip{background:var(--blue);color:#fff;border-radius:999px;padding:6px 12px;font-weight:700}
.ph{opacity:.6}
.small{font:inherit;background:none;border:none;color:var(--navy);text-decoration:underline;font-size:16px;cursor:pointer}
.slider{width:100%;height:44px;accent-color:var(--red);margin:6px 0}
.note{font-size:15px;opacity:.8;text-align:center;margin:4px 0}
.btns{display:flex;gap:12px;justify-content:center;margin-top:16px;flex-wrap:wrap}
.btns button,.end button{font:inherit;font-size:21px;font-weight:700;border-radius:999px;padding:12px 26px;cursor:pointer;border:3px solid var(--navy)}
.hint{background:#fff7d6;color:var(--navy)}
.check{background:var(--navy);color:#fff}
.hintbox{background:#fff7d6;border:2px solid #e6a700;border-radius:14px;padding:12px 14px;margin-top:14px;font-size:18px;line-height:1.4}
.fb{margin-top:14px;font-size:20px;line-height:1.45;border-radius:14px;padding:0 14px}
.fb.ok{background:#e8f5e9;border:3px solid var(--green);padding:12px 14px}
.fb.no{background:#ffebee;border:3px solid var(--red);padding:12px 14px}
.fb.warn{background:#fff7d6;border:3px solid #e6a700;padding:12px 14px}
.end{text-align:center;font-size:22px;font-weight:700;display:flex;flex-direction:column;gap:14px;align-items:center}
.end .big{font-size:56px}
footer{text-align:center;font-size:13px;opacity:.7;padding-bottom:20px}
</style>
</head>
<body>
<header>
  <a class="back" href="./">← Übersicht</a>
  <span class="badge">⭐ PROFI · 2.8</span>
  <h1>Rechteck und Quadrat</h1>
  <div class="sub">Tippe deine Antwort ein oder tippe auf die richtige Lösung. ⭐ leicht · ⭐⭐ mittel · ⭐⭐⭐ Knobelei</div>
  <div id="dots"></div>
</header>
<main><div id="card"></div></main>
<footer>Mathe 5 · Geometrie · Profi-Aufgaben</footer>
<script>
// ===== Profi-Engine (gemeinsam für alle Seiten) =====
const NAVY = "#003357", RED = "#ff3131", GREEN = "#2e7d32", BLUE = "#27abfc";

// ---------- SVG-Helfer ----------
function pt(cx, cy, r, deg) {
  const a = deg * Math.PI / 180;
  return [cx + r * Math.cos(a), cy - r * Math.sin(a)];
}
function svgWrap(w, h, inner) {
  return `<svg viewBox="0 0 ${w} ${h}" class="fig" xmlns="http://www.w3.org/2000/svg">${inner}</svg>`;
}
function gridBg(w, h, s = 20) {
  let g = "";
  for (let x = 0; x <= w; x += s) g += `<line x1="${x}" y1="0" x2="${x}" y2="${h}" stroke="#b8d8ee" stroke-width="1"/>`;
  for (let y = 0; y <= h; y += s) g += `<line x1="0" y1="${y}" x2="${w}" y2="${y}" stroke="#b8d8ee" stroke-width="1"/>`;
  return `<rect width="${w}" height="${h}" fill="#fff"/>` + g;
}
function cross(x, y, label, dx = 8, dy = -8) {
  return `<g stroke="${NAVY}" stroke-width="3"><line x1="${x - 6}" y1="${y - 6}" x2="${x + 6}" y2="${y + 6}"/><line x1="${x - 6}" y1="${y + 6}" x2="${x + 6}" y2="${y - 6}"/></g>` +
    (label ? `<text x="${x + dx}" y="${y + dy}" class="lbl">${label}</text>` : "");
}
// Geodreieck-ähnliche Skala (Halbkreis, zwei Skalen) + Winkel
function protractor(cx, cy, R, full) {
  let s = "";
  if (full) {
    s += `<circle cx="${cx}" cy="${cy}" r="${R}" fill="rgba(39,171,252,0.10)" stroke="${NAVY}" stroke-width="2"/>`;
    for (let d = 0; d < 360; d += 5) {
      const len = d % 30 === 0 ? 16 : (d % 10 === 0 ? 10 : 5);
      const [x1, y1] = pt(cx, cy, R, d), [x2, y2] = pt(cx, cy, R - len, d);
      s += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${NAVY}" stroke-width="${d % 30 === 0 ? 2 : 1}"/>`;
      if (d % 30 === 0) { const [tx, ty] = pt(cx, cy, R - 30, d); s += `<text x="${tx}" y="${ty + 5}" class="scale" text-anchor="middle">${d}</text>`; }
    }
    return s;
  }
  s += `<path d="M ${cx - R} ${cy} A ${R} ${R} 0 0 1 ${cx + R} ${cy} Z" fill="rgba(39,171,252,0.10)" stroke="${NAVY}" stroke-width="2"/>`;
  for (let d = 0; d <= 180; d += 5) {
    const len = d % 10 === 0 ? 12 : 6;
    const [x1, y1] = pt(cx, cy, R, d), [x2, y2] = pt(cx, cy, R - len, d);
    s += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${NAVY}" stroke-width="1.3"/>`;
    if (d % 10 === 0) {
      const [ox, oy] = pt(cx, cy, R - 24, d);     // äußere Skala: 0 rechts
      const [ix, iy] = pt(cx, cy, R - 48, d);     // innere Skala: 0 links
      s += `<text x="${ox}" y="${oy + 5}" class="scale" text-anchor="middle">${d}</text>`;
      s += `<text x="${ix}" y="${iy + 4}" class="scale2" text-anchor="middle">${180 - d}</text>`;
    }
  }
  s += `<circle cx="${cx}" cy="${cy}" r="4" fill="${RED}"/>`;
  return s;
}
// Winkel mit Scheitel S. flip=false: 1. Schenkel nach rechts; flip=true: nach links
function angleSvg(deg, o = {}) {
  const W = 420, H = o.full ? 420 : (o.reflex ? 275 : 240), cx = 210, cy = o.full ? 210 : 215, L = 195;
  const base = o.flip ? 180 : 0, dir2 = o.flip ? 180 - deg : deg;
  let s = `<rect width="${W}" height="${H}" fill="#fff" rx="14"/>`;
  if (o.protractor !== false) s += protractor(cx, cy, 175, o.full);
  const [ax, ay] = pt(cx, cy, L, base), [bx, by] = pt(cx, cy, L, dir2);
  // Winkelbogen
  if (o.arc !== false) {
    const r = 42;
    let start = o.flip ? dir2 : base, end = o.flip ? base : dir2;
    let large = deg > 180 ? 1 : 0;
    if (o.reflex) { start = dir2; end = 360; large = 1; }
    const [sx, sy] = pt(cx, cy, r, start), [ex, ey] = pt(cx, cy, r, end);
    s += `<path d="M ${sx} ${sy} A ${r} ${r} 0 ${large} 0 ${ex} ${ey}" fill="none" stroke="${GREEN}" stroke-width="4"/>`;
  }
  s += `<line x1="${cx}" y1="${cy}" x2="${ax}" y2="${ay}" stroke="${NAVY}" stroke-width="4" stroke-linecap="round"/>`;
  s += `<line x1="${cx}" y1="${cy}" x2="${bx}" y2="${by}" stroke="${o.legColor || NAVY}" stroke-width="4" stroke-linecap="round" id="${o.legId || ""}"/>`;
  s += `<circle cx="${cx}" cy="${cy}" r="5" fill="${NAVY}"/>`;
  return svgWrap(W, H, s);
}
function clockSvg(h, m) {
  const cx = 110, cy = 110, R = 95;
  let s = `<circle cx="${cx}" cy="${cy}" r="${R}" fill="#fff" stroke="${NAVY}" stroke-width="5"/>`;
  for (let i = 1; i <= 12; i++) {
    const [x, y] = pt(cx, cy, R - 20, 90 - i * 30);
    s += `<text x="${x}" y="${y + 7}" text-anchor="middle" class="clk">${i}</text>`;
  }
  const ma = 90 - m * 6, ha = 90 - (h % 12) * 30 - m * 0.5;
  const [mx, my] = pt(cx, cy, R - 18, ma), [hx, hy] = pt(cx, cy, R - 45, ha);
  s += `<line x1="${cx}" y1="${cy}" x2="${hx}" y2="${hy}" stroke="${NAVY}" stroke-width="8" stroke-linecap="round"/>`;
  s += `<line x1="${cx}" y1="${cy}" x2="${mx}" y2="${my}" stroke="${RED}" stroke-width="5" stroke-linecap="round"/>`;
  s += `<circle cx="${cx}" cy="${cy}" r="7" fill="${NAVY}"/>`;
  return svgWrap(220, 220, s);
}

// ---------- Engine ----------
let STATE = { i: 0, tries: 0, done: false, results: [], sel: [], order: [] };
const $ = s => document.querySelector(s);
function parseNum(v) {
  if (v == null) return NaN;
  v = String(v).trim().replace(/\s/g, "").replace(",", ".").replace(/[^0-9.\-]/g, "");
  return v === "" ? NaN : Number(v);
}
function stars(n) { return "⭐".repeat(n); }
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

function renderDots() {
  $("#dots").innerHTML = TASKS.map((t, k) => {
    const r = STATE.results[k];
    const cls = r === true ? "ok" : r === false ? "no" : (k === STATE.i ? "cur" : "");
    return `<span class="dot ${cls}">${k + 1}</span>`;
  }).join("");
}

function render() {
  renderDots();
  if (STATE.i >= TASKS.length) return renderEnd();
  const t = TASKS[STATE.i];
  STATE.tries = 0; STATE.done = false; STATE.sel = []; STATE.order = [];
  let body = `<div class="meta"><span>Aufgabe ${STATE.i + 1} von ${TASKS.length}</span><span class="lvl">${stars(t.level || 1)}</span></div>`;
  body += `<div class="q">${t.q}</div>`;
  if (t.svg) body += `<div class="figwrap">${typeof t.svg === "function" ? t.svg() : t.svg}</div>`;
  if (t.type === "num") {
    const fields = t.fields || [{ label: t.label || "", answer: t.answer, unit: t.unit || "" }];
    body += `<div class="fields">` + fields.map((f, k) =>
      `<label class="field"><span>${f.label || ""}</span><input inputmode="decimal" autocomplete="off" id="in${k}" placeholder="?"><span class="unit">${f.unit || ""}</span></label>`).join("") + `</div>`;
  } else if (t.type === "mc") {
    const idx = t.options.map((o, k) => k);
    const ord = t.noShuffle ? idx : shuffle(idx);
    body += `<div class="opts">` + ord.map(k => `<button class="opt" data-k="${k}">${t.options[k]}</button>`).join("") + `</div>`;
    if (Array.isArray(t.correct)) body += `<div class="note">Mehrere Antworten möglich.</div>`;
  } else if (t.type === "order") {
    const ord = shuffle(t.items.map((x, k) => k));
    body += `<div class="seq" id="seq"><span class="ph">Tippe der Reihe nach …</span></div>`;
    body += `<div class="opts">` + ord.map(k => `<button class="opt" data-k="${k}">${t.items[k]}</button>`).join("") + `</div>`;
    body += `<button class="small" id="reset">↺ Zurücksetzen</button>`;
  } else if (t.type === "slider") {
    body = body.replace(`<div class="figwrap">`, `<div class="figwrap" id="sfig">`);
    if (!t.svg) body += `<div class="figwrap" id="sfig"></div>`;
    body += `<input type="range" min="0" max="${t.max || 180}" step="1" value="${t.start ?? 20}" id="slider" class="slider">`;
    body += `<div class="note">Schiebe den Regler, bis der Winkel stimmt. Lies am Geodreieck ab!</div>`;
  }
  body += `<div class="btns"><button class="hint" id="hintb">💡 Tipp</button><button class="check" id="checkb">Prüfen</button></div>`;
  body += `<div id="hintbox" class="hintbox" hidden>${t.hint || "Lies die Aufgabe noch einmal genau."}</div>`;
  body += `<div id="fb" class="fb"></div>`;
  $("#card").innerHTML = body;

  // Interaktionen
  document.querySelectorAll(".opt").forEach(b => b.onclick = () => {
    if (STATE.done) return;
    const k = +b.dataset.k;
    if (t.type === "mc") {
      if (Array.isArray(t.correct)) { b.classList.toggle("sel"); STATE.sel = [...document.querySelectorAll(".opt.sel")].map(x => +x.dataset.k); }
      else { document.querySelectorAll(".opt").forEach(x => x.classList.remove("sel")); b.classList.add("sel"); STATE.sel = [k]; }
    } else if (t.type === "order") {
      if (b.disabled) return;
      STATE.order.push(k); b.disabled = true; b.classList.add("used");
      $("#seq").innerHTML = STATE.order.map((j, n) => `<span class="chip">${n + 1}. ${t.items[j]}</span>`).join("");
    }
  });
  if ($("#reset")) $("#reset").onclick = () => { if (STATE.done) return; STATE.order = []; document.querySelectorAll(".opt").forEach(x => { x.disabled = false; x.classList.remove("used"); }); $("#seq").innerHTML = `<span class="ph">Tippe der Reihe nach …</span>`; };
  if (t.type === "slider") {
    const draw = () => { $("#sfig").innerHTML = angleSvg(+$("#slider").value, { flip: t.flip, full: t.full, legColor: RED, arc: true }); };
    $("#slider").oninput = draw; draw();
  }
  document.querySelectorAll("input[id^=in]").forEach(inp => inp.addEventListener("keydown", e => { if (e.key === "Enter") check(); }));
  $("#hintb").onclick = () => { $("#hintbox").hidden = false; };
  $("#checkb").onclick = () => STATE.done ? next() : check();
}

function isRight(t) {
  if (t.type === "num") {
    const fields = t.fields || [{ answer: t.answer }];
    return fields.every((f, k) => {
      const v = parseNum($("#in" + k).value);
      const ans = Array.isArray(f.answer) ? f.answer : [f.answer];
      return ans.some(a => Math.abs(v - a) <= (f.tol ?? t.tol ?? 0.001));
    });
  }
  if (t.type === "mc") {
    const c = Array.isArray(t.correct) ? t.correct.slice().sort() : [t.correct];
    const s = STATE.sel.slice().sort();
    return c.length === s.length && c.every((x, k) => x === s[k]);
  }
  if (t.type === "order") return STATE.order.length === t.items.length && STATE.order.every((x, k) => x === k);
  if (t.type === "slider") return Math.abs(+$("#slider").value - t.target) <= (t.tol ?? 2);
  return false;
}
function empty(t) {
  if (t.type === "num") return [...document.querySelectorAll("input[id^=in]")].some(i => i.value.trim() === "");
  if (t.type === "mc") return STATE.sel.length === 0;
  if (t.type === "order") return STATE.order.length < t.items.length;
  return false;
}
function check() {
  const t = TASKS[STATE.i];
  if (empty(t)) { fb("Fülle zuerst alles aus. 🙂", "warn"); return; }
  STATE.tries++;
  if (isRight(t)) {
    STATE.results[STATE.i] = true;
    finish(`✅ Richtig! ${t.explain ? "<br>" + t.explain : ""}`, "ok");
  } else if (STATE.tries < 2) {
    fb("❌ Noch nicht. Versuch es noch einmal – oder hol dir einen 💡 Tipp.", "no");
    $("#hintbox").hidden = false;
  } else {
    STATE.results[STATE.i] = false;
    finish(`❌ Leider falsch. <b>Lösung:</b> ${t.solution}${t.explain ? "<br>" + t.explain : ""}`, "no");
  }
}
function fb(html, cls) { const f = $("#fb"); f.innerHTML = html; f.className = "fb " + cls; }
function finish(html, cls) {
  STATE.done = true; fb(html, cls);
  $("#checkb").textContent = STATE.i + 1 < TASKS.length ? "Weiter ➜" : "Fertig ➜";
  document.querySelectorAll("input,button.opt,#slider").forEach(x => x.disabled = true);
  renderDots();
}
function next() { STATE.i++; render(); window.scrollTo({ top: 0, behavior: "smooth" }); }
function renderEnd() {
  const n = STATE.results.filter(x => x === true).length, N = TASKS.length;
  const msg = n === N ? "Perfekt! Du bist ein echter Profi! 🏆" : n >= N * 0.7 ? "Stark gemacht! 💪" : "Gut geübt! Schau dir die Fehler noch einmal im Hefteintrag an.";
  $("#card").innerHTML = `<div class="end"><div class="big">${n} von ${N}</div><div>${msg}</div>
    <div class="note">Zeig dein Ergebnis deiner Lehrkraft.</div>
    <button class="check" onclick="STATE={i:0,tries:0,done:false,results:[],sel:[],order:[]};render()">↺ Nochmal</button></div>`;
}
document.addEventListener("DOMContentLoaded", render);

</script>
<script>
// Jede Seite: TOPICS[nr] = {title, tasks:[...]}
// Hilfsfunktionen für Gitterbilder
function segFig(inner, w = 420, h = 200) { return svgWrap(w, h, gridBg(w, h) + inner); }
function line(x1, y1, x2, y2, c = NAVY, w = 4) { return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${c}" stroke-width="${w}" stroke-linecap="round"/>`; }
function arrowHead(x, y, ang) { // Pfeilspitze bei (x,y), Richtung ang (Grad, math.)
  const a = ang * Math.PI / 180, s = 14;
  const p1 = [x - s * Math.cos(a - 0.45), y + s * Math.sin(a - 0.45)], p2 = [x - s * Math.cos(a + 0.45), y + s * Math.sin(a + 0.45)];
  return `<polygon points="${x},${y} ${p1} ${p2}" fill="${NAVY}"/>`;
}
function label(x, y, t, c = NAVY, size = 20) { return `<text x="${x}" y="${y}" font-family="sans-serif" font-weight="700" font-size="${size}" fill="${c}">${t}</text>`; }

// Koordinatensystem: x 0..9, y 0..6, 1 Einheit = 40 px; pts = [[x, y, "A"], ...]
function koSys(pts = [], extra = "") {
  const W = 440, H = 320, ox = 40, oy = 280, u = 40;
  const X = x => ox + x * u, Y = y => oy - y * u;
  let s = `<rect width="${W}" height="${H}" fill="#fff"/>`;
  for (let x = 0; x <= 9; x++) s += `<line x1="${X(x)}" y1="${Y(0)}" x2="${X(x)}" y2="${Y(6.4)}" stroke="#b8d8ee" stroke-width="1.5"/>`;
  for (let y = 0; y <= 6; y++) s += `<line x1="${X(0)}" y1="${Y(y)}" x2="${X(9.4)}" y2="${Y(y)}" stroke="#b8d8ee" stroke-width="1.5"/>`;
  s += line(X(0), Y(0), X(9.6), Y(0), NAVY, 3) + line(X(0), Y(0), X(0), Y(6.6), NAVY, 3);
  s += `<polygon points="${X(9.9)},${Y(0)} ${X(9.5)},${Y(0) - 7} ${X(9.5)},${Y(0) + 7}" fill="${NAVY}"/>`;
  s += `<polygon points="${X(0)},${Y(6.9)} ${X(0) - 7},${Y(6.5)} ${X(0) + 7},${Y(6.5)}" fill="${NAVY}"/>`;
  for (let x = 1; x <= 9; x++) s += `<text x="${X(x)}" y="${Y(0) + 24}" text-anchor="middle" class="scale">${x}</text>`;
  for (let y = 1; y <= 6; y++) s += `<text x="${X(0) - 12}" y="${Y(y) + 5}" text-anchor="end" class="scale">${y}</text>`;
  s += `<text x="${X(0) - 12}" y="${Y(0) + 24}" text-anchor="end" class="scale">0</text>`;
  s += `<text x="${X(9.6)}" y="${Y(0) - 10}" class="lbl" text-anchor="middle">x</text><text x="${X(0) + 14}" y="${Y(6.7)}" class="lbl">y</text>`;
  for (const [x, y, n, c] of pts) {
    const col = c || NAVY;
    s += `<g stroke="${col}" stroke-width="3.5"><line x1="${X(x) - 7}" y1="${Y(y) - 7}" x2="${X(x) + 7}" y2="${Y(y) + 7}"/><line x1="${X(x) - 7}" y1="${Y(y) + 7}" x2="${X(x) + 7}" y2="${Y(y) - 7}"/></g>`;
    if (n) s += `<text x="${X(x) + 9}" y="${Y(y) - 9}" class="lbl" fill="${col}">${n}</text>`;
  }
  return svgWrap(W, H, s + extra(X, Y));
}
